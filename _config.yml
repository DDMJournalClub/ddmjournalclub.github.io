# DDMJC Jekyll 站点配置

title: "DDMJC - Diffusion Decision Model Journal Club"
description: "DDMJC 是一个线上文献分享与交流活动，由 Drift-Diffusion Model (DDM) 兴趣小组发起。"
url: "https://ddmjournalclub.github.io"  # GitHub Pages 域名
baseurl: ""  # 根路径站点（仓库已改名 ddmjournalclub.github.io）

# 作者信息
author:
  name: "DDMJC Group"
  email: "ddmjc@example.com"
  github: "https://github.com/ddmjc"

# Jekyll 配置
timezone: Asia/Shanghai
future: true
show_drafts: false
limit_posts: 100

# Permalink 设置 - 日期 + slug (与文件名一致)
permalink: /:year-:month-:day-:slug/

# Markdown 配置
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Collections 配置
collections:
  papers:
    output: true
    permalink: /papers/:slug/
  discussions:
    output: true
    permalink: /discussions/:slug/

# 默认配置
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      status: done
  - scope:
      path: ""
      type: papers
    values:
      layout: post
      category: paper
  - scope:
      path: ""
      type: discussions
    values:
      layout: post
      category: discussion

# GitHub Pages 需要的安全配置
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# 排除文件
exclude:
  - templates/
  - Private & Shared/
  - .gitignore
  - node_modules/
  - vendor/
  - "/README.md"
  - "/README_CH.md"
  - "/README_zh.md"
  - "/task_plan.md"
  - "/findings.md"
  - "/progress.md"
  - "/REVISION_PLAN.md"
  - "*.sh"
  - "*.py"

# 包含文件
include:
  - assets

# 导航栏
navigation:
  - title: 首页
    url: /
  - title: 日程
    url: /schedule/
  - title: 文献
    url: /papers/
  - title: 资料
    url: /resources/

# 社交链接
social:
  bilibili: "https://space.bilibili.com/3461571806235136"
  github: "https://github.com/ddmjc"

